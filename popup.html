<!DOCTYPE html>

</head>

      <button id="copy-urls" class="button pulse">
        Copy URLs
      </button>

      </button>

      </button>

      </button>
      <button id="comment-pos" class="button pulse">

      </button>
      <button id="report-comment-pre" class="button pulse">
        Report Comment - Pre QA
      </button>
      <button id="report-comment-pos" class="button pulse">

      </button>
      </button>
